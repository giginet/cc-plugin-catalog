name: Build and Deploy Plugin Catalog
on:
  workflow_call:
    inputs:
      catalog-ref:
        type: string
        default: ""
        description: "Install agent-plugin-catalog from a git ref (branch, tag, or SHA) instead of PyPI"
      output-dir:
        type: string
        default: "_site"
        description: "Output directory for generated files"
      base-url:
        type: string
        default: ""
        description: "Base URL for OGP meta tags (e.g. https://example.github.io/my-marketplace)"
      logo:
        type: string
        default: ""
        description: "Path to a logo image in the repository (e.g. assets/logo.png)"
      marketplace-repository:
        type: string
        default: ""
        description: "Marketplace repo identifier for install commands (e.g. owner/repo). Auto-detected from git remote if not set."
      marketplace-format:
        type: string
        default: "auto"
        description: "Marketplace format: auto (prefers Codex), claude, or codex"
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Install git
        if: inputs.catalog-ref != ''
        run: apt-get update -qq && apt-get install -y -qq git > /dev/null
      - name: Install agent-plugin-catalog
        run: pip install --quiet ${{ inputs.catalog-ref && format('git+https://github.com/giginet/agent-plugin-catalog@{0}', inputs.catalog-ref) || 'agent-plugin-catalog' }}
      - name: Build site
        env:
          CATALOG_OUTPUT: ${{ inputs.output-dir }}
          CATALOG_BASE_URL: ${{ inputs.base-url }}
          CATALOG_LOGO: ${{ inputs.logo }}
          CATALOG_REPOSITORY: ${{ inputs.marketplace-repository }}
          CATALOG_FORMAT: ${{ inputs.marketplace-format }}
        run: >-
          agent-plugin-catalog build . -o "$CATALOG_OUTPUT"
          --base-url "$CATALOG_BASE_URL" --logo "$CATALOG_LOGO"
          --marketplace-repository "$CATALOG_REPOSITORY"
          --marketplace-format "$CATALOG_FORMAT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.output-dir }}
      - id: deployment
        uses: actions/deploy-pages@v5
