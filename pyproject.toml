[project]
name = "agent-plugin-catalog"
version = "2.0.0"
description = "Static site generator for Claude Code and Codex Plugin Marketplace repositories"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.5",
    "pyyaml>=6.0",
]

[project.scripts]
agent-plugin-catalog = "agent_plugin_catalog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_plugin_catalog"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
    "ty>=0.0.1a1",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
exclude-newer = "1 week"

[tool.ty.environment]
python-version = "3.12"
